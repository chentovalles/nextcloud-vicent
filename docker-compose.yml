services:
  db:
    image: mariadb:11.8
    container_name: nc-db-vicent
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED
    environment:
      MARIADB_ROOT_PASSWORD: "1234"
      MARIADB_DATABASE: nextcloud
      MARIADB_USER: nextcloud
      MARIADB_PASSWORD: "1234"
    volumes:
      - db_data:/var/lib/mysql

  app:
    image: nextcloud
    container_name: nc-app-vicent
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8084:80"
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: "1234"
      NEXTCLOUD_ADMIN_USER: admin-vicent
      NEXTCLOUD_ADMIN_PASSWORD: "1234"
      NEXTCLOUD_TRUSTED_DOMAINS: localhost, 10.20.7.22/24
    volumes:
      - nextcloud_data:/var/www/html

volumes:
  db_data:
  nextcloud_data:
